name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Composer clones private repositories (mike-bronner/phpcs-rules) over
      # HTTPS and needs a credential to do it. Same PAT the sync workflows use.
      COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.DEVELOPER_SETTINGS_TOKEN }}"} }'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Manifest is up to date
        run: php bin/generate-manifest --check

      - name: Lint (Pint)
        run: ./vendor/bin/pint --test

      - name: Tests (Pest)
        run: composer test
