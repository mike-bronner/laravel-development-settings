name: Reusable Sync Workflow

on:
  workflow_call:
    secrets:
      DEVELOPER_SETTINGS_TOKEN:
        required: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Checkout developer-settings
        uses: actions/checkout@v4
        with:
          repository: mikebronner/development-settings
          token: ${{ secrets.DEVELOPER_SETTINGS_TOKEN }}
          path: _developer-settings

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      # One line per tracked entry, as "project path<TAB>package path". The two
      # differ wherever the package ships a file under another name, so the
      # copy below has to read the pair rather than one path used twice.
      # FileDiscovery owns the plain-entry/keyed-entry rule; it is required
      # directly because the package is checked out, not installed.
      - name: Extract tracked paths from config
        id: config
        run: |
          PAIRS=$(php -r '
            require "_developer-settings/src/Support/FileDiscovery.php";

            $paths = (require "_developer-settings/config/development-settings.php")["paths"];
            $discovery = MikeBronner\DevelopmentSettings\Support\FileDiscovery::class;
            $tracked = $discovery::trackedPaths($paths["directories"] ?? [])
              + $discovery::trackedPaths($paths["files"] ?? []);

            foreach ($tracked as $projectPath => $packagePath) {
              echo $projectPath . "\t" . $packagePath . PHP_EOL;
            }
          ')
          echo "paths<<EOF" >> $GITHUB_OUTPUT
          echo "$PAIRS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Copy tracked files to package
        run: |
          TRACKED_PATHS="${{ steps.config.outputs.paths }}"

          while IFS=$'\t' read -r project_path package_path; do
            if [ -z "$project_path" ] || [ -z "$package_path" ]; then
              continue
            fi
            if [ -d "$project_path" ]; then
              find "$project_path" -type f | while read -r file; do
                target="_developer-settings/$package_path${file#"$project_path"}"
                mkdir -p "$(dirname "$target")"
                cp "$file" "$target"
              done
            elif [ -f "$project_path" ]; then
              target="_developer-settings/$package_path"
              mkdir -p "$(dirname "$target")"
              cp "$project_path" "$target"
            fi
          done <<< "$TRACKED_PATHS"

      - name: Detect changes
        id: changes
        run: |
          cd _developer-settings
          MODIFIED=$(git diff --name-only)
          NEW=$(git ls-files --others --exclude-standard)
          ALL_CHANGED=$(echo -e "$MODIFIED\n$NEW" | sort -u | grep -v '^$' || true)

          if [ -n "$ALL_CHANGED" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "files<<EOF" >> $GITHUB_OUTPUT
            echo "$ALL_CHANGED" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          path: _developer-settings
          token: ${{ secrets.DEVELOPER_SETTINGS_TOKEN }}
          branch: sync/${{ github.repository_owner }}/${{ github.event.repository.name }}
          delete-branch: true
          title: "sync: Update from ${{ github.repository }}"
          body: |
            ## Automated Sync

            Changes to shared config files detected in `${{ github.repository }}`.

            **Changed files:**
            ```
            ${{ steps.changes.outputs.files }}
            ```

            **Source commit:** ${{ github.event.head_commit.url }}

            ---
            After merging, tag a new release to distribute changes.
          commit-message: "sync: Update from ${{ github.repository }}"
          labels: |
            automated
            sync
