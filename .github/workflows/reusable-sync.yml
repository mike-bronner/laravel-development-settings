name: Reusable Sync Workflow

on:
  workflow_call:
    secrets:
      DEVELOPER_SETTINGS_TOKEN:
        required: true

jobs:
  sync:
    if: github.repository != 'mike-bronner/laravel-development-settings'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Checkout laravel-development-settings
        uses: actions/checkout@v4
        with:
          repository: mike-bronner/laravel-development-settings
          token: ${{ secrets.DEVELOPER_SETTINGS_TOKEN }}
          path: _laravel-development-settings

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Copy changed files to package
        run: |
          php -r '
            $package = "_laravel-development-settings";

            require "$package/src/Support/CheckedFile.php";
            require "$package/src/Support/FileDiscovery.php";
            require "$package/src/Support/ManagedSection.php";
            require "$package/src/Support/Manifest.php";
            require "$package/src/Support/ManifestReader.php";
            require "$package/src/Support/ReverseSync.php";

            $paths = (require "$package/config/development-settings.php")["paths"];
            $manifest = (new MikeBronner\DevelopmentSettings\Support\ManifestReader)->read("$package/manifest.json");

            try {
              $changed = (new MikeBronner\DevelopmentSettings\Support\ReverseSync($manifest))
                ->export(getcwd(), $package, $paths);
            } catch (RuntimeException $exception) {
              fwrite(STDERR, $exception->getMessage() . PHP_EOL);
              exit(1);
            }

            foreach ($changed as $projectPath => $packagePath) {
              echo json_encode($projectPath) . " -> " . json_encode($packagePath) . PHP_EOL;
            }
          '

      - name: Detect changes
        id: changes
        run: |
          cd _laravel-development-settings
          MODIFIED=$(git diff --name-only)
          NEW=$(git ls-files --others --exclude-standard)
          ALL_CHANGED=$(echo -e "$MODIFIED\n$NEW" | sort -u | grep -v '^$' || true)

          if [ -n "$ALL_CHANGED" ]; then
            FENCE='```'
            while printf '%s\n' "$ALL_CHANGED" | grep -qF -- "$FENCE"; do
              FENCE="$FENCE\`"
            done

            DELIMITER="EOF_$(openssl rand -hex 16)"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "fence=$FENCE" >> "$GITHUB_OUTPUT"
            echo "files<<$DELIMITER" >> "$GITHUB_OUTPUT"
            echo "$ALL_CHANGED" >> "$GITHUB_OUTPUT"
            echo "$DELIMITER" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          path: _laravel-development-settings
          token: ${{ secrets.DEVELOPER_SETTINGS_TOKEN }}
          branch: sync/${{ github.repository_owner }}/${{ github.event.repository.name }}
          delete-branch: true
          title: "sync: Update from ${{ github.repository }}"
          body: |
            ## Automated Sync

            Changes to shared config files detected in `${{ github.repository }}`.

            **Changed files:**
            ${{ steps.changes.outputs.fence }}
            ${{ steps.changes.outputs.files }}
            ${{ steps.changes.outputs.fence }}

            **Source commit:** ${{ github.event.head_commit.url }}

            ---
            After merging, tag a new release to distribute changes.
          commit-message: "sync: Update from ${{ github.repository }}"
          labels: |
            automated
            sync
