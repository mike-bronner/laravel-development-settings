name: Reusable Sync Workflow

on:
  workflow_call:
    secrets:
      DEVELOPER_SETTINGS_TOKEN:
        required: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Checkout developer-settings
        uses: actions/checkout@v4
        with:
          repository: mikebronner/development-settings
          token: ${{ secrets.DEVELOPER_SETTINGS_TOKEN }}
          path: _developer-settings

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      # One line per changed tracked file, as "project path<TAB>package path".
      # The two differ wherever the package ships a file under another name, so
      # the copy below reads the pair rather than one path used twice.
      # ReverseSync expands directory entries to files, skips anything reached
      # through a symlink, and drops every file whose checksum the manifest
      # knows: an unmodified shipped version, even an older one, is not a local
      # edit. The job fails with ReverseSync's message when the loaded manifest
      # records no paths (missing, unparseable or empty), because every tracked
      # file would then look modified. It also fails on a changed path holding
      # a tab or line break, which this line format cannot carry. The classes
      # are required directly because the package is checked out, not installed.
      - name: List changed tracked files
        id: config
        run: |
          PAIRS=$(php -r '
            $package = "_developer-settings";

            require "$package/src/Support/FileDiscovery.php";
            require "$package/src/Support/Manifest.php";
            require "$package/src/Support/ReverseSync.php";

            $paths = (require "$package/config/development-settings.php")["paths"];
            $manifest = MikeBronner\DevelopmentSettings\Support\Manifest::load("$package/manifest.json");

            try {
              $changed = (new MikeBronner\DevelopmentSettings\Support\ReverseSync($manifest))
                ->changedFiles(getcwd(), $paths);
            } catch (RuntimeException $exception) {
              fwrite(STDERR, $exception->getMessage() . PHP_EOL);
              exit(1);
            }

            foreach ($changed as $projectPath => $packagePath) {
              echo $projectPath . "\t" . $packagePath . PHP_EOL;
            }
          ')
          # The paths come from the project, so the delimiter must not be
          # guessable from inside it.
          DELIMITER="EOF_$(openssl rand -hex 16)"
          echo "paths<<$DELIMITER" >> "$GITHUB_OUTPUT"
          echo "$PAIRS" >> "$GITHUB_OUTPUT"
          echo "$DELIMITER" >> "$GITHUB_OUTPUT"

      # The pairs arrive through the environment, never through an expression
      # inside the script: an expression is pasted into the script text before
      # bash parses it, so a crafted filename would run as shell.
      - name: Copy changed files to package
        env:
          TRACKED_PATHS: ${{ steps.config.outputs.paths }}
        run: |
          while IFS=$'\t' read -r project_path package_path; do
            if [ -z "$project_path" ] || [ -z "$package_path" ]; then
              continue
            fi
            target="_developer-settings/$package_path"
            mkdir -p "$(dirname "$target")"
            cp "$project_path" "$target"
          done <<< "$TRACKED_PATHS"

      - name: Detect changes
        id: changes
        run: |
          cd _developer-settings
          MODIFIED=$(git diff --name-only)
          NEW=$(git ls-files --others --exclude-standard)
          ALL_CHANGED=$(echo -e "$MODIFIED\n$NEW" | sort -u | grep -v '^$' || true)

          if [ -n "$ALL_CHANGED" ]; then
            DELIMITER="EOF_$(openssl rand -hex 16)"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "files<<$DELIMITER" >> "$GITHUB_OUTPUT"
            echo "$ALL_CHANGED" >> "$GITHUB_OUTPUT"
            echo "$DELIMITER" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          path: _developer-settings
          token: ${{ secrets.DEVELOPER_SETTINGS_TOKEN }}
          branch: sync/${{ github.repository_owner }}/${{ github.event.repository.name }}
          delete-branch: true
          title: "sync: Update from ${{ github.repository }}"
          body: |
            ## Automated Sync

            Changes to shared config files detected in `${{ github.repository }}`.

            **Changed files:**
            ```
            ${{ steps.changes.outputs.files }}
            ```

            **Source commit:** ${{ github.event.head_commit.url }}

            ---
            After merging, tag a new release to distribute changes.
          commit-message: "sync: Update from ${{ github.repository }}"
          labels: |
            automated
            sync
