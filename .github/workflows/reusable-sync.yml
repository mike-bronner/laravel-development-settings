name: Reusable Sync Workflow

on:
  workflow_call:
    secrets:
      DEVELOPER_SETTINGS_TOKEN:
        required: true

jobs:
  sync:
    # The package runs this workflow on itself, because it ships the calling
    # workflow as a tracked file and the shipped source is its own root copy.
    # It is not a consuming project: its root .gitignore differs on purpose
    # from the shipped resources/project/gitignore, so a run here copies the
    # root file over the shipped one and proposes that upstream (PR #32).
    # The name is the one after the rename from mikebronner/development-settings,
    # which github.repository reports from then on. Every other caller runs.
    if: github.repository != 'mike-bronner/laravel-development-settings'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Checkout laravel-development-settings
        uses: actions/checkout@v4
        with:
          repository: mike-bronner/laravel-development-settings
          token: ${{ secrets.DEVELOPER_SETTINGS_TOKEN }}
          path: _laravel-development-settings

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      # Writes every changed tracked file into the package checkout, under its
      # package path, which differs from the project path wherever the package
      # ships a file under another name. ReverseSync expands directory entries
      # to files, skips anything reached through a symlink, and drops every
      # file whose checksum the manifest knows: an unmodified shipped version,
      # even an older one, is not a local edit. A managed target (.gitignore)
      # proposes only the part above its sync marker, and nothing at all when
      # it has no marker or more than one, so a project's own rules below the
      # marker never reach the package. The job fails with ReverseSync's
      # message when the loaded manifest records no paths (missing,
      # unparseable or empty), because every tracked file would then look
      # modified. It also fails when a file cannot be read or written, rather
      # than dropping that proposal while the job stays green. The classes are
      # required directly because the package is checked out, not installed.
      # The copy happens here, in PHP, because a managed file's proposal is
      # part of the file, which `cp` cannot write.
      - name: Copy changed files to package
        run: |
          php -r '
            $package = "_laravel-development-settings";

            require "$package/src/Support/CheckedFile.php";
            require "$package/src/Support/FileDiscovery.php";
            require "$package/src/Support/ManagedSection.php";
            require "$package/src/Support/Manifest.php";
            require "$package/src/Support/ReverseSync.php";

            $paths = (require "$package/config/development-settings.php")["paths"];
            $manifest = MikeBronner\DevelopmentSettings\Support\Manifest::load("$package/manifest.json");

            try {
              $changed = (new MikeBronner\DevelopmentSettings\Support\ReverseSync($manifest))
                ->export(getcwd(), $package, $paths);
            } catch (RuntimeException $exception) {
              fwrite(STDERR, $exception->getMessage() . PHP_EOL);
              exit(1);
            }

            foreach ($changed as $projectPath => $packagePath) {
              echo json_encode($projectPath) . " -> " . json_encode($packagePath) . PHP_EOL;
            }
          '

      # The PR body shows the changed files inside a code fence. A file name is
      # project input and may hold backticks, and a run of them as long as the
      # fence would close it early and let the rest render as markdown. So the
      # fence is made one backtick longer than the longest run in the list,
      # which no line of the list can then close.
      - name: Detect changes
        id: changes
        run: |
          cd _laravel-development-settings
          MODIFIED=$(git diff --name-only)
          NEW=$(git ls-files --others --exclude-standard)
          ALL_CHANGED=$(echo -e "$MODIFIED\n$NEW" | sort -u | grep -v '^$' || true)

          if [ -n "$ALL_CHANGED" ]; then
            FENCE='```'
            while printf '%s\n' "$ALL_CHANGED" | grep -qF -- "$FENCE"; do
              FENCE="$FENCE\`"
            done

            DELIMITER="EOF_$(openssl rand -hex 16)"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "fence=$FENCE" >> "$GITHUB_OUTPUT"
            echo "files<<$DELIMITER" >> "$GITHUB_OUTPUT"
            echo "$ALL_CHANGED" >> "$GITHUB_OUTPUT"
            echo "$DELIMITER" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          path: _laravel-development-settings
          token: ${{ secrets.DEVELOPER_SETTINGS_TOKEN }}
          branch: sync/${{ github.repository_owner }}/${{ github.event.repository.name }}
          delete-branch: true
          title: "sync: Update from ${{ github.repository }}"
          body: |
            ## Automated Sync

            Changes to shared config files detected in `${{ github.repository }}`.

            **Changed files:**
            ${{ steps.changes.outputs.fence }}
            ${{ steps.changes.outputs.files }}
            ${{ steps.changes.outputs.fence }}

            **Source commit:** ${{ github.event.head_commit.url }}

            ---
            After merging, tag a new release to distribute changes.
          commit-message: "sync: Update from ${{ github.repository }}"
          labels: |
            automated
            sync
